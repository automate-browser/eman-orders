<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c3f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eman Orders">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Eman Bakery Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout concept: sidebar app shell on desktop, icon rail on tablet, bottom tab bar on phone. Product picking by category chips and tap tiles with a live cart beside them. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface2:#ebf0ed; --ink:#14231c; --muted:#5a6d63; --line:#d9e2dd;
  --brand:#0f5c3f; --brand-ink:#ffffff; --brand-soft:#dcefe6; --accent:#d99a12; --accent-soft:#fbf0d3;
  --good:#1d8a52; --good-soft:#dcf1e5; --warn:#a86300; --warn-soft:#fbecd0; --bad:#bf3a2b; --bad-soft:#f9dfdb; --info:#2765a8; --info-soft:#dde9f6;
  --shadow:0 1px 2px rgba(20,35,28,.06),0 6px 18px rgba(20,35,28,.06);
  --f-ui:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-disp:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
  --tab-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1511; --surface:#151f1a; --surface2:#1c2923; --ink:#e7f0eb; --muted:#93a89d; --line:#293a31;
  --brand:#46c18c; --brand-ink:#062016; --brand-soft:#17382a; --accent:#f0bd45; --accent-soft:#3a2f10;
  --good:#4ccf8d; --good-soft:#163627; --warn:#f0b04a; --warn-soft:#3b2b0e; --bad:#f0786a; --bad-soft:#40201c; --info:#74a9e6; --info-soft:#18304a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1511; --surface:#151f1a; --surface2:#1c2923; --ink:#e7f0eb; --muted:#93a89d; --line:#293a31;
  --brand:#46c18c; --brand-ink:#062016; --brand-soft:#17382a; --accent:#f0bd45; --accent-soft:#3a2f10;
  --good:#4ccf8d; --good-soft:#163627; --warn:#f0b04a; --warn-soft:#3b2b0e; --bad:#f0786a; --bad-soft:#40201c; --info:#74a9e6; --info-soft:#18304a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3{font-family:var(--f-disp);margin:0;letter-spacing:-.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none;vertical-align:middle}
#app{height:100%}
.shell{height:100%;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:6px;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:20px}
.brand b{font-family:var(--f-disp);font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;text-align:left;position:relative;min-height:44px}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--brand-soft);color:var(--brand)}
.nav button[disabled]{opacity:.35;cursor:not-allowed}
.nav .bdg{margin-left:auto}
.nav-sep{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--warn);display:grid;place-items:center;font-weight:800;flex:none}
.who div{min-width:0}.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{color:var(--muted)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:21px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn:hover{background:var(--surface2)}
.bdg{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:19px;height:19px;padding:0 5px;display:inline-grid;place-items:center}
.iconbtn .bdg{position:absolute;top:-6px;right:-6px}
.content{flex:1;min-height:0;overflow:auto;padding:22px 24px 90px;scroll-behavior:auto}
.page{max-width:1280px;margin:0 auto}
.banner{display:flex;gap:12px;align-items:center;background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:11px;font-weight:700;min-height:44px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:17px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.stat{display:flex;flex-direction:column;gap:4px}
.stat small{color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.stat b{font-family:var(--f-disp);font-size:28px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.brand{background:var(--brand-soft);color:var(--brand)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 13px;min-height:44px;width:100%;min-width:0}
.inp:focus,.btn:focus-visible,button:focus-visible,.pt:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.search{position:relative}.search .ic{position:absolute;left:12px;top:12px;color:var(--muted)}.search .inp{padding-left:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:700;font-size:14px;min-height:42px;display:inline-flex;gap:8px;align-items:center}
.chip small{color:var(--muted);font-weight:700}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}.chip.on small{color:inherit;opacity:.8}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.bigopt{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:26px 20px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:130px}
.bigopt:hover{border-color:var(--brand)}.bigopt.on{border-color:var(--brand);background:var(--brand-soft)}
.bigopt b{font-family:var(--f-disp);font-size:22px}.bigopt span{color:var(--muted)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stp{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--muted)}
.stp.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}.stp.done{color:var(--ink)}
.stp i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:11px}
.stp.on i{background:var(--brand);color:var(--brand-ink)}.stp.done i{background:var(--good);color:#fff}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;min-height:56px}
.li:last-child{border-bottom:0}.li:hover{background:var(--surface2)}
.li .grow{flex:1;min-width:0}.li b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li small{color:var(--muted)}
.pick{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.pt{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:13px;display:flex;flex-direction:column;gap:6px;min-height:142px;text-align:left;cursor:pointer;position:relative;user-select:none}
.pt:hover{border-color:color-mix(in srgb,var(--brand) 55%,var(--line))}
.pt.on{border-color:var(--brand);background:var(--brand-soft)}
.pt-name{font-weight:800;line-height:1.2;font-size:14.5px}
.pt-meta{color:var(--muted);font-size:12.5px}
.pt-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.price{font-family:var(--f-disp);font-weight:700;font-size:18px}
.tagc{font-size:10.5px;font-weight:800;background:var(--accent-soft);color:var(--warn);border-radius:6px;padding:2px 6px;letter-spacing:.03em;text-transform:uppercase}
.stepper{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{flex:0 0 40px;width:40px;height:40px;border:0;background:var(--surface2);display:grid;place-items:center}
.stepper button:hover{background:var(--brand-soft)}
.stepper input{width:46px;flex:1 1 46px;min-width:0;max-width:none;padding:0;margin:0;height:40px;border:0;border-radius:0;box-shadow:none;text-align:center;font-weight:800;background:transparent;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.cart{position:sticky;top:0;max-height:calc(100vh - 150px);display:flex;flex-direction:column}
.cart .lines{overflow:auto;display:flex;flex-direction:column;min-height:60px}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cl b{font-size:14px;line-height:1.2}.cl small{color:var(--muted)}
.tot{display:grid;gap:6px;padding-top:12px;margin-top:6px;border-top:2px solid var(--ink)}
.tot div{display:flex;justify-content:space-between}.tot .grand{font-family:var(--f-disp);font-size:24px;font-weight:700}
.cartbar{display:none}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px}
.keypad button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;font-family:var(--f-disp)}
.keypad button:hover{background:var(--surface2)}
.kdisp{font-family:var(--f-disp);font-size:68px;font-weight:700;line-height:1;text-align:center;padding:16px;border:2px solid var(--brand);border-radius:18px;background:var(--surface);max-width:340px}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);position:sticky;top:0;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;padding:11px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--brand)}.sw input:checked+i::after{left:23px}
.sw input:focus-visible+i{outline:2px solid var(--brand);outline-offset:2px}
.ftog{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.ftog small{color:var(--muted);display:block}
.mask{position:fixed;inset:0;background:rgba(6,12,9,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{width:min(760px,100%)}
.modal h2{font-size:22px;margin-bottom:14px}
.sheet{align-items:flex-end;padding:0}.sheet .modal{border-radius:22px 22px 0 0;width:100%;max-height:85%;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.pop{position:fixed;top:64px;right:16px;width:min(380px,calc(100% - 32px));z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.28);padding:14px;max-height:70%;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.demo{position:fixed;right:12px;bottom:12px;z-index:35;background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;max-width:calc(100% - 24px);box-shadow:var(--shadow)}
.flip svg{transform:rotate(180deg)}
.payl{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);flex-wrap:wrap}
.payl .inp{width:130px;text-align:right}
.pstat{padding:11px 14px;border-radius:12px;font-weight:800;background:var(--surface2);color:var(--muted)}
.pstat.ok{background:var(--good-soft);color:var(--good)}.pstat.bad{background:var(--warn-soft);color:var(--warn)}
.hint{font-size:13.5px;font-weight:700;color:var(--info);background:var(--info-soft);border-radius:10px;padding:8px 12px}
#printarea{display:none}
.rcwrap{background:#e9e6df;border-radius:12px;padding:14px;max-height:52vh;overflow:auto;display:flex;justify-content:center}
.rcpt{width:72mm;max-width:100%;background:#fff;color:#000;padding:4mm 3mm;font:12px/1.4 "Courier New",ui-monospace,monospace;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.rcpt .c{text-align:center}.rcpt .big{font-size:17px;font-weight:700}.rcpt .hr{border-top:1px dashed #000;margin:5px 0}
.rcpt .r2{display:flex;justify-content:space-between;gap:6px}.rcpt .it{margin:3px 0}.rcpt .tt{font-size:16px;font-weight:700}
.rcpt .ar{direction:rtl;font-family:"Segoe UI",Tahoma,sans-serif;font-size:14px}
@media print{html,body{background:#fff!important}#app,#layer,.demo,.demopill{display:none!important}#printarea{display:block!important}}
.dst{background:#fff;color:#000;font:12px/1.45 Inter,Arial,sans-serif;padding:0}
.dst h1{font:700 20px/1.2 Arial,sans-serif;margin:0}.dst .ar{direction:rtl;font-size:15px}
.dst .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
.dst .ttl{background:#000;color:#fff;padding:7px 10px;font-weight:700;letter-spacing:.04em;display:flex;justify-content:space-between;margin-bottom:10px}
.dst table{width:100%;border-collapse:collapse;margin:6px 0 12px}.dst th,.dst td{border:1px solid #000;padding:4px 7px;text-align:left}.dst th{background:#eee}.dst .n{text-align:right;font-variant-numeric:tabular-nums}
.dst h3{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.dst .box{border:2px solid #000;padding:8px 10px;margin-top:10px}.dst .box .r{display:flex;justify-content:space-between;padding:2px 0}.dst .box .gt{border-top:2px solid #000;margin-top:4px;padding-top:6px;font-size:16px;font-weight:700}
.dst .note{font-size:11px;color:#333;margin-top:8px}
.dst.slip{width:72mm;font:11px/1.35 "Courier New",monospace;margin:0 auto}.dst.slip .hd{display:block;text-align:center}.dst.slip .px,.dst.slip .nos{display:none}.dst.slip th,.dst.slip td{padding:2px 3px}.dst.slip .ttl{display:block;text-align:center}
.dsview{background:#e9e6df;border-radius:12px;padding:12px;max-height:56vh;overflow:auto}.dsview .dst{margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.18);padding:12px;max-width:760px}.dsview .dst.slip{padding:8px}
.pgbrk{page-break-after:always;break-after:page}
.demopill{position:fixed;right:10px;top:64px;z-index:35;border:1px dashed var(--accent);background:var(--surface);color:var(--warn);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;box-shadow:var(--shadow)}
.demo b{color:var(--warn)}
.demo button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
.tabbar{display:none}
.landing{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);overflow:auto;height:100%}
.hero{background:var(--brand);color:var(--brand-ink);padding:56px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.hero h1{font-size:clamp(34px,4.4vw,58px);line-height:1.02}
.hero p{max-width:46ch;opacity:.92;font-size:17px}
.hero ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-weight:600}
.hero li{display:flex;gap:10px;align-items:center}
.login{display:flex;align-items:center;justify-content:center;padding:32px}
.login .card{width:min(420px,100%)}
.progress{display:grid;gap:10px;margin:8px 0 4px}
.progress div{display:flex;gap:10px;align-items:center;color:var(--muted);font-weight:600}
.progress div.done{color:var(--good)}.progress div.act{color:var(--ink)}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cd{font-variant-numeric:tabular-nums;font-weight:800}
.cd.warn{color:var(--warn)}.cd.bad{color:var(--bad)}
.empty{padding:34px 12px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700;text-align:right}

/* ===== visual refresh ===== */
:root{--r:18px;--ring:color-mix(in srgb,var(--brand) 22%,transparent);--shadow:0 1px 2px rgba(15,40,30,.05),0 8px 24px rgba(15,40,30,.07);--shadow2:0 2px 4px rgba(15,40,30,.06),0 16px 40px rgba(15,40,30,.12)}
body{background:radial-gradient(900px 420px at 100% -8%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),radial-gradient(700px 400px at -10% 110%,color-mix(in srgb,var(--brand) 10%,transparent),transparent 70%),var(--bg)}
.side{background:linear-gradient(180deg,#0f4a34 0%,#0a3326 60%,#072419 100%);border-right:0;color:#d4eadf}
.brand .logo{background:linear-gradient(135deg,#f3c35a,#d99a12);color:#3a2700;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.brand b{color:#fff}.brand small{color:#9fc4b2}
.nav button{color:#b7d3c5;border-radius:12px;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button.on{background:rgba(255,255,255,.15);color:#fff;box-shadow:inset 3px 0 0 #f3c35a}
.who{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff}.who small{color:#9fc4b2}
.top{background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.iconbtn{border-radius:13px;transition:transform .12s,background .12s}.iconbtn:active{transform:scale(.94)}
.card{border-radius:var(--r);border:1px solid color-mix(in srgb,var(--line) 75%,transparent);box-shadow:var(--shadow)}
.btn{border-radius:12px;transition:transform .1s,filter .15s,background .15s,box-shadow .15s}.btn:active{transform:scale(.975)}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 86%,#fff),var(--brand));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 16px color-mix(in srgb,var(--brand) 32%,transparent)}
.inp{border-radius:12px;transition:border-color .15s,box-shadow .15s;background:color-mix(in srgb,var(--surface) 92%,var(--surface2))}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--ring);background:var(--surface)}
.field label{font-size:11.5px;letter-spacing:.07em}
.chips{flex-wrap:wrap;overflow:visible;gap:6px;padding:0}
.chip{min-height:36px;padding:6px 13px;font-size:13.5px;transition:transform .1s,background .15s,border-color .15s}.chip:active{transform:scale(.96)}
.chip:hover{border-color:var(--brand)}
.chip.on{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 86%,#fff),var(--brand));box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 30%,transparent)}
.tabs{display:inline-flex;max-width:100%;background:var(--surface2);padding:4px;border-radius:14px;border-bottom:0;gap:2px;margin-bottom:18px}
.tab{border-radius:10px;border-bottom:0;padding:7px 15px;min-height:38px;transition:background .15s}
.tab.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tbl{border-radius:16px;box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 75%,transparent)}
th{background:color-mix(in srgb,var(--surface2) 70%,var(--surface))}
tbody tr{transition:background .12s}tbody tr:hover td{background:color-mix(in srgb,var(--brand) 5%,transparent)}

.stat{position:relative;overflow:hidden}

.stat:nth-child(2) .si{background:var(--accent-soft);color:var(--warn)}.stat:nth-child(3) .si{background:var(--info-soft);color:var(--info)}.stat:nth-child(4) .si{background:var(--good-soft);color:var(--good)}

.greet::before,.greet::after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(243,195,90,.35),transparent 70%)}
.greet::before{width:260px;height:260px;right:-60px;top:-110px}.greet::after{width:180px;height:180px;right:140px;bottom:-110px;opacity:.6}
.greet h2{font-size:clamp(24px,3vw,32px);position:relative}.greet p{margin:6px 0 0;opacity:.85;position:relative}
.bigopt{border-radius:20px;transition:transform .15s,box-shadow .15s,border-color .15s;background:linear-gradient(160deg,var(--surface),color-mix(in srgb,var(--brand-soft) 55%,var(--surface)))}
.bigopt:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}.bigopt .ic{color:var(--brand)}
.stp{transition:background .15s}
.mask{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);background:rgba(6,18,12,.5)}
.modal{border-radius:24px;box-shadow:var(--shadow2)}
.pop{border-radius:18px;box-shadow:var(--shadow2)}
.toast{border-radius:14px;box-shadow:var(--shadow2);padding:12px 20px}
.pill{font-weight:700}
.keypad button{border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:transform .08s,background .12s}.keypad button:active{transform:scale(.95);background:var(--brand-soft)}
.kdisp{border-radius:20px;box-shadow:0 0 0 5px var(--ring)}
/* picker */
.pk{display:flex;flex-direction:column;gap:12px}
.pkh{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pkh i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:11px}

.pcsrow{display:flex;flex-wrap:wrap;gap:8px}

.pcsb:hover{border-color:var(--brand)}.pcsb:active{transform:scale(.96)}
.pcsb.on{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 86%,#fff),var(--brand));border-color:var(--brand);color:var(--brand-ink);box-shadow:0 6px 14px color-mix(in srgb,var(--brand) 30%,transparent)}.pcsb.on small{color:inherit;opacity:.85}
.pt{border-radius:18px;border-width:1.5px;transition:transform .12s,border-color .15s,box-shadow .15s;box-shadow:0 1px 2px rgba(15,40,30,.04)}

.pt::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.pt.on::before{background:var(--brand)}
.pt-name{padding-left:4px}
.pt-meta{padding-left:4px}.pt-foot{padding-left:4px}
.ghost{border:2px dashed var(--line);border-radius:18px;padding:34px 18px;text-align:center;color:var(--muted)}
.ghost b{display:block;font-family:var(--f-disp);font-size:18px;color:var(--ink);margin-bottom:4px}
/* landing */
.lp{height:100%;overflow:auto;background:var(--bg);scroll-behavior:smooth}
.lpn{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:12px max(20px,calc((100% - 1160px)/2));background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}

.lpn nav{margin-left:auto;display:flex;gap:6px;align-items:center}.lpn nav a{padding:8px 12px;border-radius:10px;font-weight:700;color:var(--muted);text-decoration:none}.lpn nav a:hover{background:var(--surface2);color:var(--ink)}
.lpw{max-width:1160px;margin:0 auto;padding:0 20px}
.lph{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center;padding:56px 0 40px}
.lph .tag{display:inline-flex;gap:8px;align-items:center;background:var(--accent-soft);color:var(--warn);font-weight:800;font-size:12.5px;padding:6px 12px;border-radius:99px;letter-spacing:.03em}
.lph h1{font-size:clamp(38px,5.2vw,68px);line-height:1;margin:16px 0 16px}
.lph h1 em{font-style:normal;background:linear-gradient(120deg,#0f5c3f,#2da36f);-webkit-background-clip:text;background-clip:text;color:transparent}
.lph p.lead{font-size:18px;color:var(--muted);max-width:52ch;margin:0 0 24px}
.lph .cta{display:flex;gap:12px;flex-wrap:wrap}.lph .cta .btn{min-height:52px;padding:12px 24px;font-size:16px}
.lph .trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-weight:700;font-size:13.5px}.lph .trust span{display:flex;gap:6px;align-items:center}.lph .trust .ic{color:var(--good)}
.dev{position:relative;justify-self:center;width:min(380px,100%)}
.dev .glow{position:absolute;inset:-30px;background:radial-gradient(circle at 60% 40%,rgba(243,195,90,.45),transparent 62%),radial-gradient(circle at 20% 80%,rgba(15,92,63,.28),transparent 60%);filter:blur(10px);z-index:0}
.phone{position:relative;z-index:1;background:#0b1712;border-radius:38px;padding:11px;box-shadow:0 30px 70px rgba(10,40,28,.35)}
.phone .scr{background:var(--bg);border-radius:29px;padding:16px 14px;height:500px;overflow:hidden;position:relative}
.phone .hdr{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-disp);font-weight:700;font-size:17px;margin-bottom:10px}
.mchips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}.mchips i{font-style:normal;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}.mchips i.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.mtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mt{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:9px;font-size:11px;font-weight:800;position:relative}.mt small{display:block;color:var(--muted);font-weight:700}.mt b{font-family:var(--f-disp);font-size:15px}
.mt.on{border-color:var(--brand);background:var(--brand-soft)}
.mcart{background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);font-size:12px}
.mcart .ln{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);opacity:0;animation:lnin .5s forwards}
.mcart .ln:nth-child(2){animation-delay:.6s}.mcart .ln:nth-child(3){animation-delay:1.4s}.mcart .ln:nth-child(4){animation-delay:2.2s}
.mcart .tt{display:flex;justify-content:space-between;font-family:var(--f-disp);font-weight:700;font-size:17px;padding-top:8px}
@keyframes lnin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mbtn{margin-top:10px;background:linear-gradient(180deg,#1c7a56,#0f5c3f);color:#fff;text-align:center;padding:11px;border-radius:13px;font-weight:800;font-size:13px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(15,92,63,.4)}50%{box-shadow:0 0 0 9px rgba(15,92,63,0)}}
.float{position:absolute;z-index:2;animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(-12px) rotate(calc(var(--rot,0deg) + 4deg))}}
.lpb{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:22px;overflow:hidden;margin:10px 0 56px;box-shadow:var(--shadow)}
.lpb div{background:var(--surface);padding:22px;text-align:center}.lpb b{display:block;font-family:var(--f-disp);font-size:34px;color:var(--brand)}.lpb span{color:var(--muted);font-weight:700;font-size:13.5px}
.lps{padding:30px 0 40px}.lps h2{font-size:clamp(28px,3.4vw,40px);text-align:center;margin-bottom:8px}.lps .sub{text-align:center;color:var(--muted);max-width:60ch;margin:0 auto 30px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.fc{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 75%,transparent);border-radius:20px;padding:22px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.fc:hover{transform:translateY(-3px);box-shadow:var(--shadow2)}
.fc .fi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px;background:var(--brand-soft);color:var(--brand)}
.fc:nth-child(3n+2) .fi{background:var(--accent-soft);color:var(--warn)}.fc:nth-child(3n) .fi{background:var(--info-soft);color:var(--info)}
.fc h3{font-size:18px;margin-bottom:6px}.fc p{margin:0;color:var(--muted);font-size:14.5px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;counter-reset:s}
.fl{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px 20px}
.fl::before{counter-increment:s;content:counter(s);position:absolute;top:-14px;left:18px;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 4px 10px rgba(15,92,63,.4)}
.fl b{font-family:var(--f-disp);font-size:17px;display:block;margin-bottom:4px}.fl span{color:var(--muted);font-size:14px}
.lpc{margin:20px 0 40px;border-radius:28px;padding:46px 28px;text-align:center;color:#fff;background:linear-gradient(120deg,#0f5c3f,#093626);position:relative;overflow:hidden;box-shadow:var(--shadow2)}
.lpc h2{font-size:clamp(26px,3.4vw,38px);margin-bottom:8px}.lpc p{opacity:.85;margin:0 0 22px}
.lpc .btn.pri{background:linear-gradient(180deg,#f6cf6f,#e0a21d);color:#3a2700;border:0;min-height:52px;padding:12px 28px;font-size:16px}
.lpf{padding:20px 0 40px;text-align:center;color:var(--muted);font-size:13.5px}
/* login */
.auth{height:100%;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);overflow:auto;background:var(--bg)}
.scene{position:relative;overflow:hidden;background:linear-gradient(170deg,#0e5a3e 0%,#083b2a 55%,#05261b 100%);min-height:100%}
.scene svg.art{position:absolute;inset:0;width:100%;height:100%}
.scene .cap{position:absolute;left:44px;right:44px;top:92px;color:#fff;z-index:3;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.scene .cap h2{font-size:clamp(28px,3.4vw,44px);line-height:1.05;margin-bottom:10px}.scene .cap p{opacity:.85;max-width:40ch;margin:0}
.scene .bk{position:absolute;left:28px;top:24px;z-index:3;display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;border:0;background:rgba(255,255,255,.12);padding:8px 14px;border-radius:99px;backdrop-filter:blur(6px)}
.authf{display:flex;align-items:center;justify-content:center;padding:32px 24px}
.authf .box{width:min(420px,100%);display:flex;flex-direction:column;gap:18px}
.authf h2{font-size:34px}.authf .inw{position:relative}.authf .inw .ic{position:absolute;left:13px;top:13px;color:var(--muted)}.authf .inw .inp{padding-left:42px}
.authf .inw .eye{position:absolute;right:6px;top:4px;border:0;background:none;width:38px;height:36px;color:var(--muted);display:grid;place-items:center}
.authf .brand b,.lpn .brand b{display:block!important;color:var(--ink)}.authf .brand small,.lpn .brand small{display:block!important}.authf .brand b{color:var(--ink)}.authf .brand small{color:var(--muted)}a.btn{color:var(--ink);text-decoration:none}
.authf .btn.pri{min-height:50px;font-size:16px}
.demoacc{border:1px dashed var(--line);border-radius:16px;padding:12px 14px}.demoacc small{display:block;color:var(--muted);font-weight:700;margin-bottom:8px}
.steam{transform-box:fill-box;transform-origin:50% 100%;animation:steam 4.5s ease-in infinite;opacity:0}
.steam.s2{animation-delay:1.5s}.steam.s3{animation-delay:3s}
@keyframes steam{0%{transform:translateY(20px) scaleX(.8);opacity:0}25%{opacity:.55}100%{transform:translateY(-110px) scaleX(1.5);opacity:0}}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite alternate}
@keyframes flick{from{opacity:.78;transform:scale(.97)}to{opacity:1;transform:scale(1.03)}}
.loaf{transform-box:fill-box;transform-origin:50% 50%;animation:bob 6s ease-in-out infinite}
.loaf.l2{animation-delay:-2s}.loaf.l3{animation-delay:-4s}.loaf.l4{animation-delay:-1s}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
.sway.w2{animation-delay:-1.2s}.sway.w3{animation-delay:-2.4s}.sway.w4{animation-delay:-3.6s}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.spark{animation:tw 3s ease-in-out infinite}.spark.k2{animation-delay:-1s}.spark.k3{animation-delay:-2s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
@media (max-width:900px){.lph{grid-template-columns:minmax(0,1fr);padding-top:30px}.dev{margin-top:10px}.lpb{grid-template-columns:repeat(2,1fr)}.lpn nav a{display:none}
 .auth{grid-template-columns:minmax(0,1fr);grid-template-rows:200px auto}.scene{min-height:0}.scene .cap{display:none}.scene .bk{left:14px;top:12px}.authf{padding:22px 16px 40px;align-items:flex-start}}

@media (max-width:1100px){
  .shell{grid-template-columns:72px minmax(0,1fr)}
  .side{padding:12px 8px;align-items:center}
  .brand b,.brand small,.nav button span.lb,.who div,.nav-sep{display:none}
  .brand{padding:4px 0 10px}.nav button{justify-content:center;padding:10px;width:52px}.nav .bdg{position:absolute;top:2px;right:2px;margin:0}
  .who{padding:6px;border:0}
  .pick{grid-template-columns:minmax(0,1fr)}
  .cart.desk{display:none}
  .cartbar{display:flex;position:fixed;left:16px;right:16px;bottom:16px;z-index:25;background:var(--brand);color:var(--brand-ink);border:0;border-radius:16px;padding:14px 18px;align-items:center;justify-content:space-between;font-weight:800;box-shadow:var(--shadow);min-height:56px}
  .landing{grid-template-columns:minmax(0,1fr)}.hero{padding:34px 24px}
}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding:10px 16px}.top h1{font-size:19px}
  .content{padding:16px 16px calc(var(--tab-h) + 96px)}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:28;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line)}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
  .tabbar button.on{color:var(--brand)}.tabbar button[disabled]{opacity:.35}
  .tabbar .bdg{position:absolute;top:6px;left:calc(50% + 8px)}
  .cartbar{bottom:calc(var(--tab-h) + 12px + env(safe-area-inset-bottom,0px))}
  .prods{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .pt{padding:11px;min-height:134px}
  .demo{bottom:calc(var(--tab-h) + 12px + env(safe-area-inset-bottom,0px))}
  .kdisp{font-size:56px}
  .catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.catgrid .chip[data-act=catopen]{grid-column:1/-1}.catgrid .chip{justify-content:center;text-align:center;min-height:38px}
  .hero{padding:26px 18px;gap:14px}.hero ul{display:none}.login{padding:18px 16px}
  .pop{top:58px;right:8px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */

async function api(method,url,body){
  let r;
  try{r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'})}
  catch(e){throw new Error('No connection to the server. Check the internet and try again.')}
  let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401&&S&&S.session){S=blank();lastSnap='';UI.auth='login';UI.modal=null;render();throw new Error((j&&j.error)||'Please sign in.')}
  if(!r.ok)throw new Error((j&&j.error)||('Server error '+r.status));
  return j;
}
async function refresh(quiet){
  const r=await fetch('/api/state',{credentials:'same-origin',cache:'no-store'});
  if(r.status===401){S=blank();lastSnap='';return true}
  if(!r.ok)throw new Error('state '+r.status);
  const txt=await r.text();
  const cmp=txt.replace(/"serverNow":\d+,?/,'');
  if(quiet&&cmp===lastSnap)return false;
  lastSnap=cmp;S=JSON.parse(txt);skew=S.serverNow-Date.now();return true;
}
// run a server action; errors become a message, then the screen is refreshed from the server
async function act(fn,okMsg){
  if(UI.busy)return false;UI.busy=true;
  try{const r=await fn();await refresh();if(okMsg)toast(typeof okMsg==='function'?okMsg(r):okMsg);else render();return r===undefined?true:r}
  catch(e){toast(e.message);return false}
  finally{UI.busy=false}
}

async function newOrder(d){
  const r=await api('POST','/api/orders',{branch:d.branch,cust:d.cust,traysIn:d.traysIn,lines:d.lines.map(l=>({code:l.code,qty:l.qty}))});
  await refresh();return r.id;
}
async function saveOrder(d){await api('PUT','/api/orders/'+d.orderId,{traysIn:d.traysIn,lines:d.lines.map(l=>({code:l.code,qty:l.qty}))});await refresh()}
async function cancelOrder(id,reason){await api('POST','/api/orders/'+id+'/cancel',{reason});await refresh()}
async function finalizeOrder(id,traysOut){
  UI.modal={type:'progress',orderId:id,step:1,offline:S.set.offline};render();
  const tm=setInterval(()=>{if(UI.modal&&UI.modal.type==='progress'&&UI.modal.step<3){UI.modal.step++;render()}},1100);
  try{
    const r=await api('POST','/api/orders/'+id+'/finalize',{traysOut});
    clearInterval(tm);await refresh();
    UI.modal={type:'done',orderId:id};render();
  }catch(e){
    clearInterval(tm);
    try{await refresh()}catch(x){}
    const o=S.orders.find(x=>x.id===id);
    if(o&&o.status==='final'){UI.modal={type:'done',orderId:id};render();return} // the server finished although the answer was lost
    UI.modal={type:'fin',id,tout:String(traysOut)};
    render();toast(e.message);
  }
}

  <div class="card stat"><div class="si">${ic('tray',20)}</div><small>Trays with customers</small><b class="num">${nf0.format(heldAll())}</b><span>${nf0.format(stockAll())} in the branches</span></div></div>

  <div class="card"><h3>Recent activity</h3>${S.audit.length?`<div class="list">${S.audit.slice(0,6).map(a=>`<div class="li"><div class="grow"><b>${esc(a.action)} <span class="muted" style="font-weight:600">${esc(a.ref)}</span></b><small>${esc(a.user)} · ${fmtT(a.t)} · ${esc(a.detail).slice(0,110)}</small></div></div>`).join('')}</div>`:'<div class="empty">Nothing yet.</div>'}</div></div>`;

/* ---- new order ---- */
function draft(){return UI.draft}
function startDraft(){UI.draft={orderId:null,branch:null,cust:null,traysIn:null,tin:'',lines:[],cat:null,step:1}}
function editDraft(id){
  const o=S.orders.find(x=>x.id===id);
  UI.draft={orderId:id,branch:o.branch,cust:o.cust,traysIn:o.traysIn,tin:String(o.traysIn),lines:o.lines.map(l=>({code:l.code,qty:l.qty})),cat:null,step:4};
  UI.view='new';
}
function stepsBar(d){
  const L=['Branch','Customer','Trays','Products'];
  return `<div class="steps">${L.map((l,i)=>{const n=i+1;const cls=d.step===n?'on':(d.step>n?'done':'');
   const val=n===1?d.branch:n===2&&d.cust?cust(d.cust).name:n===3&&d.traysIn!=null?d.traysIn+' trays':'';
   const can=!d.orderId&&n<d.step||(d.orderId&&n>=3&&n!==d.step);
   return `<button class="stp ${cls}" ${can?`data-act="step" data-id="${n}"`:'disabled'} style="${can?'cursor:pointer':''}"><i>${d.step>n?ic('check',12):n}</i>${l}${val?`<b style="color:var(--ink)">· ${esc(val)}</b>`:''}</button>`}).join('')}</div>`;
}
function vNew(){

    b=`<h2 style="margin-bottom:14px">Which branch is this order for?</h2><div class="big">${S.set.branches.map(x=>`<button class="bigopt ${d.branch===x?'on':''}" data-act="branch" data-id="${esc(x)}">${ic('home',26)}<b>${esc(x)}</b><span>Tap to continue</span></button>`).join('')}</div><p class="muted">The branch stays in this app. It is not sent to Odoo.</p>`;
  } else if(d.step===2){
    b=`<div class="row sp" style="margin-bottom:12px"><h2>Choose the customer</h2></div><div class="search" style="margin-bottom:10px"><span>${ic('search',18)}</span><input class="inp" id="cq" data-list="custList" placeholder="Search 90 customers" value="${esc(UI.q.custList||'')}" autocomplete="off"></div><div class="card" style="padding:6px 12px"><div class="list" id="custList">${lCust()}</div></div>`;
  } else if(d.step===3){
    const v=d.tin||'0';
    b=`<h2 style="margin-bottom:6px">How many trays did ${esc(cust(d.cust).name)} bring?</h2><p class="muted" style="margin:0 0 10px">Brought trays are taken off what they owe and added to the ${esc(d.branch)} stock.</p><div class="hint" style="margin-bottom:14px">${maxIn()>0?`${esc(cust(d.cust).name)} holds ${maxIn()} trays. You cannot enter more than that.`:`${esc(cust(d.cust).name)} holds no trays, so only 0 can be entered.`}</div>
    <div class="stack" style="align-items:flex-start"><div class="kdisp num" id="kd" style="width:100%">${esc(v)}</div>
    <div class="row">${[0,5,10,20,30].map(n=>`<button class="chip" data-act="tset" data-id="${n}">${n}</button>`).join('')}</div>
    <div class="keypad" style="width:100%">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="key" data-id="${n}">${n}</button>`).join('')}<button data-act="key" data-id="C" aria-label="Clear">C</button><button data-act="key" data-id="0">0</button><button data-act="key" data-id="B" aria-label="Backspace">⌫</button></div>
    <button class="btn pri" style="width:100%;max-width:340px" data-act="tnext">Continue to products ${ic('chev',18)}</button></div>`;
  } else b=vPick(d);
  return stepsBar(d)+b;
}
function lCust(){
  const q=(UI.q.custList||'').toLowerCase();
  const list=S.customers.filter(c=>c.active&&(!q||c.name.toLowerCase().includes(q)||c.code.toLowerCase().includes(q)));
  if(!list.length)return '<div class="empty">No customer matches.</div>';
  return list.map(c=>{const bal=balance(c);return `<button class="li" data-act="pickcust" data-id="${c.code}"><div class="grow"><b>${esc(c.name)}</b><small>${c.code} · ${held(c.code)} trays held</small></div><span class="num" style="font-weight:800;color:${bal<0?'var(--good)':'var(--ink)'}">${bal<0?'-':''}${sar(Math.abs(bal))}</span>${ic('chev',18)}</button>`}).join('');
}
function cats(){const m={};S.products.filter(p=>p.active).forEach(p=>m[p.cat]=(m[p.cat]||0)+1);return Object.keys(m).sort().map(k=>[k,m[k]])}
function usual(cc){
  const set=new Set();S.orders.filter(o=>o.cust===cc&&o.status==='final').slice(0,3).forEach(o=>o.lines.forEach(l=>set.add(l.code)));return [...set];
}
function vPick(d){
  const cs=cats();const us=usual(d.cust);
  if(d.cat&&d.cat!=='__usual'&&!cs.find(c=>c[0]===d.cat))d.cat=null;
  const inCat={};d.lines.forEach(l=>{const p=prod(l.code);if(p)inCat[p.cat]=(inCat[p.cat]||0)+l.qty});
  const nice=s=>s.replace(/ BREAD$/,'').toLowerCase().replace(/\b\w/g,x=>x.toUpperCase());
  const chips=(us.length?[`<button class="chip ${d.cat==='__usual'?'on':''}" data-act="cat" data-id="__usual">★ Usual</button>`]:[]).concat(cs.map(c=>`<button class="chip ${d.cat===c[0]?'on':''}" data-act="cat" data-id="${esc(c[0])}">${esc(nice(c[0]))}${inCat[c[0]]?` <b>${inCat[c[0]]}</b>`:''}</button>`)).join('');
  const small=innerWidth<=760;
  const chipsAll=chips;
  const inC=d.cat&&d.cat!=='__usual'?S.products.filter(p=>p.active&&p.cat===d.cat):[];
  const sizes=[...new Set(inC.map(p=>p.ppp))].sort((a,b)=>a-b);
  if(sizes.length===1&&d.pcs==null)d.pcs=sizes[0];
  if(d.pcs!=null&&!sizes.includes(d.pcs)&&d.cat!=='__usual')d.pcs=null;
  let items=[];
  if(d.cat==='__usual')items=S.products.filter(p=>p.active&&us.includes(p.code));
  else if(d.cat&&d.pcs!=null)items=inC.filter(p=>p.ppp===d.pcs);
  const tiles=items.map(p=>{const q=(d.lines.find(l=>l.code===p.code)||{}).qty||0;const pr=priceFor(d.cust,p.code);
    return `<div class="pt ${q?'on':''}" data-act="padd" data-id="${p.code}" tabindex="0" role="button" aria-label="Add ${esc(p.name)}"><div class="pt-name">${esc(p.name)}</div><div class="pt-meta">${p.ppp} pcs per packet</div>
    <div class="pt-foot"><div><span class="price num">${nf.format(pr.v)}</span> ${pr.custom?'<span class="tagc">Custom</span>':''}</div></div>
    <div class="stepper" style="${q?'':'visibility:hidden'}"><button data-act="pdec" data-id="${p.code}" aria-label="Less">${ic('minus',18)}</button><input inputmode="numeric" data-qty="${p.code}" value="${q}" aria-label="Quantity"><button data-act="pinc" data-id="${p.code}" aria-label="More">${ic('plus',18)}</button></div></div>`}).join('');
  const pcsRow=sizes.length>1?`<div><div class="pkh"><i>2</i> Pieces per packet</div><div class="pcsrow" style="margin-top:8px">${sizes.map(n=>`<button class="pcsb ${d.pcs===n?'on':''}" data-act="pcs" data-id="${n}"><b>${n}</b><small>${inC.filter(p=>p.ppp===n).length} item${inC.filter(p=>p.ppp===n).length>1?'s':''}</small></button>`).join('')}</div></div>`:'';
  const c=cust(d.cust);
  let body;
  if(!d.cat)body=`<div class="ghost"><b>Pick a category</b>Then choose the pieces per packet, then tap the product.</div>`;
  else if(d.cat!=='__usual'&&d.pcs==null)body=`<div class="ghost"><b>How many pieces per packet?</b>Choose one above to see the products.</div>`;
  else body=`<div><div class="pkh"><i>${d.cat==='__usual'?'2':'3'}</i> ${d.cat==='__usual'?'Usual products for this customer':'Products'}</div><div class="prods" style="margin-top:8px">${tiles||'<div class="empty">Nothing here yet.</div>'}</div></div>`;
  return `<div class="pick"><div class="pk"><div class="row sp"><div><b>${esc(c.name)}</b> <span class="muted">· ${esc(d.branch)} · ${d.traysIn} trays brought</span></div></div>
  <div><div class="pkh"><i>1</i> Category</div><div class="catgrid" id="chips" style="margin-top:8px">${small&&d.cat&&!d.catOpen?`<button class="chip on" data-act="catopen">${esc(d.cat==='__usual'?'★ Usual':nice(d.cat))} &nbsp;·&nbsp; Change</button>`:chips}</div></div>${pcsRow}${body}</div>
  <div class="cart desk card">${cartHtml(d)}</div></div>
  ${d.lines.length?`<button class="cartbar" data-act="opencart"><span>${ic('cart')} ${d.lines.reduce((a,l)=>a+l.qty,0)} packets</span><span class="num">${sar0(totals(d.lines,d.cust).rounded)} &nbsp;›</span></button>`:''}`;
}
function cartHtml(d){
  const T=totals(d.lines,d.cust);const edit=!!d.orderId;
  const lines=d.lines.map(l=>{const p=prod(l.code);const pr=priceFor(d.cust,l.code).v;
    return `<div class="cl"><div><b>${esc(p.name)}</b><br><small class="num">${nf.format(pr)} × ${l.qty} = ${nf.format(pr*l.qty)}</small></div><div class="stepper"><button data-act="pdec" data-id="${l.code}" aria-label="Less">${ic('minus',16)}</button><input inputmode="numeric" data-qty="${l.code}" value="${l.qty}" aria-label="Quantity"><button data-act="pinc" data-id="${l.code}" aria-label="More">${ic('plus',16)}</button></div></div>`}).join('');
  return `<div class="row sp"><h3 style="margin:0">${edit?'Editing '+d.orderId:'Order so far'}</h3>${d.lines.length?`<button class="btn sm" data-act="clearcart">Clear</button>`:''}</div>
  <div class="lines">${lines||'<div class="empty">Tap a product to add it.</div>'}</div>
  <div class="tot"><div><span class="muted">Subtotal</span><span class="num">${sar(T.sub)}</span></div><div><span class="muted">Whole-riyal rounding</span><span class="num">${T.diff>=0?'+':''}${nf.format(T.diff/100)}</span></div><div class="grand"><span>Total</span><span class="num">${sar0(T.rounded)}</span></div></div>
  <div style="margin-top:12px" class="stack"><button class="btn pri" data-act="${edit?'savechg':'create'}" ${d.lines.length?'':'disabled'}>${ic('check',18)} ${edit?'Save changes':'Create order'}</button>${edit?`<button class="btn" data-act="canceledit">Back without saving</button>`:''}</div>
  <p class="muted" style="font-size:12.5px;margin:10px 0 0">${edit?'Time left':'After creating, finalize within'} ${S.set.finalizeMin} minutes and before midnight.</p>`;
}

/* ---------- combined day statement ---------- */
const dkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)};
const dEnd=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,23,59,59,999).getTime()};
function asOf(cc,key,incl){
  const ok=k=>incl?k<=key:k<key;let v=toC(cust(cc).o0||0);
  S.orders.forEach(o=>{if(o.cust===cc&&o.status==='final'&&ok(dkey(o.finalizedAt)))v+=o.total});
  S.payments.forEach(p=>{if(p.cust===cc&&ok(p.date||dkey(p.t)))v-=toC(p.amount)});
  S.credits.forEach(p=>{if(p.cust===cc&&ok(dkey(p.t)))v-=toC(p.amount)});
  return v;
}
function dayData(cc,key){
  const inv=S.orders.filter(o=>o.cust===cc&&o.status==='final'&&dkey(o.finalizedAt)===key).sort((a,b)=>a.finalizedAt-b.finalizedAt);
  const cr=S.credits.filter(p=>p.cust===cc&&dkey(p.t)===key).sort((a,b)=>a.t-b.t);
  const pay=S.payments.filter(p=>p.cust===cc&&(p.date||dkey(p.t))===key).sort((a,b)=>a.t-b.t);
  const m={};inv.forEach(o=>o.lines.forEach(l=>{const k=l.code+'|'+l.price;const e=m[k]||(m[k]={code:l.code,price:l.price,qty:0,amt:0});e.qty+=l.qty;e.amt+=toC(l.price)*l.qty}));
  const lines=Object.values(m).sort((a,b)=>prod(a.code).name.localeCompare(prod(b.code).name));
  const tr=S.trays.filter(r=>r.cust===cc&&dkey(r.t)===key);
  const trIn=-tr.filter(r=>r.type==='in'||r.type==='adjust').reduce((a,r)=>a+r.qty,0);
  const trOut=tr.filter(r=>r.type==='out').reduce((a,r)=>a+r.qty,0);
  const trHeld=S.trays.filter(r=>r.cust===cc&&r.t<=dEnd(key)).reduce((a,r)=>a+r.qty,0);
  const branches=[...new Set(inv.map(o=>o.branch))];
  return {cc,key,inv,cr,pay,lines,trIn,trOut,trHeld,branches,
    sub:lines.reduce((a,l)=>a+l.amt,0),rnd:inv.reduce((a,o)=>a+o.rounding,0),invTot:inv.reduce((a,o)=>a+o.total,0),
    crTot:cr.reduce((a,p)=>a+toC(p.amount),0),payTot:pay.reduce((a,p)=>a+toC(p.amount),0),
    open:asOf(cc,key,false),close:asOf(cc,key,true),pend:S.orders.filter(o=>o.cust===cc&&o.status==='pending'&&dkey(o.createdAt)===key).length};
}
const fmtLong=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})};
const sgn=c=>(c<0?'-':'')+nf.format(Math.abs(c)/100);
function dayHtml(D,fmt){
  const c=cust(D.cc);const slip=fmt==='slip';
  const isToday=dkey(now())!==D.key;
  return `<div class="dst ${slip?'slip':''}"><div class="hd"><div><h1>EMAN BAKERY</h1><div class="ar">مخابز إيمان جدة للخبز</div>${D.branches.length?`<div>${esc(D.branches.join(' / '))}</div>`:''}</div><div style="text-align:right"><b>Customer</b><div style="font-size:15px;font-weight:700">${esc(c.name)}</div><div>${c.code}</div></div></div>

  } else if(f.id==='cnf'){
    const amt=parseFloat($('#ca').value);if(!UI.sel.cn||!(amt>0)){toast('Pick a customer and enter an amount');return}
    const cn=UI.sel.cn,note=$('#cnn').value;act(async()=>{const r=await api('POST','/api/credits',{cust:cn,amount:amt,reason:UI.sel.reason||'Discount',note});UI.sel.cn=null;return r},r=>r.id+(r.odoo==='posted'?' posted as a credit note':' saved, waiting for Odoo'));
  } else if(f.id==='bof'){
    act(async()=>{for(let i=0;i<S.set.branches.length;i++){const br=S.set.branches[i];const v=Math.max(0,parseInt(document.getElementById('bo'+i).value,10)||0);if(v!==openB(br))await api('POST','/api/admin/trays/branch',{branch:br,qty:v})}},'Branch stock saved');
  } else if(f.id==='uf'){saveUser()}
  else if(f.id==='pf'){saveProd()}
  else if(f.id==='cf'){
    const n=$('#cnm').value.trim();if(n.length<2){$('#cerr').textContent='Enter the customer name.';return}
    const ob=parseFloat($('#cob').value)||0;
    act(async()=>{const r=await api('POST','/api/admin/customers',{name:n,opening:ob});UI.modal=null;return r},r=>'Customer '+r.code+' added. Create the same customer in Odoo too.');
  } else if(f.id==='setf'){
    act(()=>api('PUT','/api/admin/settings',{finalizeMin:parseInt($('#s1').value,10)||60,autoPrint:$('#s5').checked,footer:$('#s6').value.trim()}),'Settings saved');
  }
});
async function saveUser(){
  const m=UI.modal;const name=$('#un').value.trim(),email=$('#ue').value.trim().toLowerCase(),key=$('#uk').value,pw=$('#up').value;
  const err=x=>{$('#uerr').textContent=x};
  if(name.length<2)return err('Enter a name.');if(!/^\S+@\S+\.\S+$/.test(email))return err('Enter the Odoo login email.');
  if(!m.id&&(pw.length<8))return err('Password needs at least 8 characters.');
  if(pw&&pw.length<8)return err('Password needs at least 8 characters.');
  if(!m.id&&!key)return err('Paste the Odoo API key for this user.');
  const feat=[...document.querySelectorAll('[data-feat]')].filter(x=>x.checked).map(x=>x.dataset.feat);
  const adm=$('#uadm').checked,act0=$('#ua').checked;
  const body={name,email,admin:adm,active:act0,feat,key:key||undefined,password:pw||undefined};
  const ok=await act(()=>m.id?api('PUT','/api/admin/users/'+m.id,body):api('POST','/api/admin/users',body),'User saved');
  if(ok){UI.modal=null;render()}
}
async function saveProd(){
  const m=UI.modal;const err=x=>{$('#perr').textContent=x};
  const code=$('#pcode').value.trim().toUpperCase(),name=$('#pname').value.trim().toUpperCase(),cat=$('#pcat').value.trim().toUpperCase(),ppp=parseInt($('#pppi').value,10),df=parseFloat($('#pdf').value),act0=$('#pact').checked;
  if(!code||name.length<2||!cat)return err('Fill in code, name and category.');if(!(ppp>0)||!(df>=0))return err('Pieces and price must be numbers.');
  if(!m.id&&S.products.some(p=>p.code===code))return err('This code exists already.');
  const ok=await act(()=>api('POST','/api/admin/products',{code,name,cat,ppp,dflt:df,active:act0}),'Product saved. Make sure the same code exists in Odoo.');
  if(ok){UI.modal=null;render()}
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pa'){payState().total=t.value;updPay();return}
  if(t.id==='pd'){payState().date=t.value;return}
  if(t.id==='pn'){payState().note=t.value;return}
  if(t.dataset.pl){const l=payState().lines.find(x=>x.cc===t.dataset.pl);if(l)l.amt=t.value;updPay();return}
  if(t.dataset.list){const k=t.dataset.list;UI.q[k]=t.value;const L={custList:lCust,cvList:lCV,ordList:lOrders,apList:lAP,acList:lAC,otList:lOT,auList:lAU,payList:lPayPick,cnList:()=>lPick('cn'),adjList:()=>lPick('adj'),prList:()=>lPrices(UI.sel.admCust&&UI.tab.admin==='custs'&&UI.view==='admin'?UI.sel.admCust:UI.sel.custView,UI.view==='admin')};const el=document.getElementById(k);if(el&&L[k])el.innerHTML=L[k]()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.qty){const v=parseInt(t.value,10)||0;const i=UI.draft.lines.findIndex(l=>l.code===t.dataset.qty);if(v<=0){if(i>=0)UI.draft.lines.splice(i,1)}else if(i>=0)UI.draft.lines[i].qty=v;else UI.draft.lines.push({code:t.dataset.qty,qty:v});render()}
  else if(t.dataset.price){
    const cc=t.dataset.cust,pcd=t.dataset.price;const raw=t.value.trim();
    if(raw!==''&&!(parseFloat(raw)>=0)){toast('Enter a valid price');return}
    act(()=>api('PUT','/api/admin/price',{cust:cc,prod:pcd,price:raw===''?null:parseFloat(raw)}),'Price saved and logged').then(()=>{const el=document.getElementById('prList');if(el)el.innerHTML=lPrices(cc,true)});
  }
  else if(t.id==='trayf'){UI.sel.trayCust=t.value||null;render()}
  else if(t.id==='dd'){UI.dayKey=t.value||dkey(now());render()}
  else if(t.id==='trayb'){UI.sel.trayBr=t.value||null;render()}
  else if(t.dataset.copen){
    const cc=t.dataset.copen;const v=Math.max(0,parseInt(t.value,10)||0);
    if(v!==openC(cc))act(()=>api('POST','/api/admin/trays/customer',{cust:cc,qty:v}),cust(cc).name+': opening '+v+' trays saved');
  }
  else if(t.id==='auser'){UI.sel.auser=t.value;render()}
  else if(t.id==='offtog'){act(()=>api('PUT','/api/admin/offline',{offline:t.checked}))}
  else if(t.id==='impf'){const f=t.files&&t.files[0];if(!f)return;f.text().then(txt=>{let j;try{j=JSON.parse(txt)}catch(x){return toast('This file is not the starting-data file')}act(()=>api('POST','/api/admin/import',j),r=>'Loaded '+r.products+' products, '+r.customers+' customers ('+r.newCustomers+' new), '+r.prices+' customer prices')})}
});
try{history.pushState({g:1},'')}catch(x){}
window.addEventListener('popstate',()=>{if(S&&S.session)goBack();try{history.pushState({g:1},'')}catch(x){}});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){const t=e.target.closest&&e.target.closest('.pt');if(t&&e.target===t){e.preventDefault();t.click()}}
  if(e.key==='Escape'&&UI.modal&&UI.modal.type!=='progress'){UI.modal=null;render()}
});

/* ---------- boot ---------- */
(async function(){
  try{PUB=await (await fetch('/api/public')).json()}catch(x){}
  try{await refresh()}catch(x){S=blank()}
  if(!S)S=blank();
  render();setInterval(tick,1000);
  const poll=()=>{if(S&&S.session&&!UI.busy&&!(UI.modal&&UI.modal.type==='progress')&&document.visibilityState==='visible')refresh(true).then(ch=>{if(ch)render()}).catch(()=>{})};
  setInterval(poll,15000);
  document.addEventListener('visibilitychange',poll);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
})();
</script>
</body>
</html>
